services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        STACK_NAME: ${STACK_NAME:-codatende}
        ENABLE_FINANCIAL: ${ENABLE_FINANCIAL:-false}
        GERENCIANET_PIX_CERT: ${GERENCIANET_PIX_CERT:-production-cert}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      BACKEND_URL: ${BACKEND_URL:-http://localhost:3000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3001}
      PORT: "3000"
      PROXY_PORT: "3000"
      DB_DIALECT: postgres
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASS: postgres123
      DB_NAME: codatende
      JWT_SECRET: ${JWT_SECRET:-atendechat-local-jwt-secret-change-me}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-atendechat-local-refresh-secret-change-me}
      REDIS_URI: redis://redis:6379
      REDIS_OPT_LIMITER_MAX: "1"
      REDIS_OPT_LIMITER_DURATION: "3000"
      USER_LIMIT: ${USER_LIMIT:-100}
      CONNECTIONS_LIMIT: ${CONNECTIONS_LIMIT:-10}
      CLOSED_SEND_BY_ME: "true"
      ENABLE_FINANCIAL: ${ENABLE_FINANCIAL:-false}
      GERENCIANET_SANDBOX: ${GERENCIANET_SANDBOX:-false}
      GERENCIANET_PIX_CERT: ${GERENCIANET_PIX_CERT:-production-cert}
      GERENCIANET_CLIENT_ID: ${GERENCIANET_CLIENT_ID:-}
      GERENCIANET_CLIENT_SECRET: ${GERENCIANET_CLIENT_SECRET:-}
      GERENCIANET_PIX_KEY: ${GERENCIANET_PIX_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - app-network
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        REACT_APP_BACKEND_URL: ${BACKEND_URL:-http://localhost:3000}
        REACT_APP_HOURS_CLOSE_TICKETS_AUTO: "24"
        STACK_NAME: ${STACK_NAME:-codatende}
        REACT_APP_COLOR: ${COLOR:-#682EE3}
        REACT_APP_TAB_NAME: ${TAB_NAME:-Atendechat}
    ports:
      - "${FRONTEND_PORT:-3001}:3001"
    depends_on:
      - backend
    networks:
      - app-network
    restart: unless-stopped

  postgres:
    image: postgres:14-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: codatende
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d codatende"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - app-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "6380:6379"
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
